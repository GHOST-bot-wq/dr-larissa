<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" fill="none">
  <defs>
    <linearGradient id="bgDepil" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFCF9"/>
      <stop offset="50%" stop-color="#FAF7F3"/>
      <stop offset="100%" stop-color="#EAD7D3" stop-opacity="0.45"/>
    </linearGradient>
    <radialGradient id="laserGlow" cx="50%" cy="40%" r="40%">
      <stop offset="0%" stop-color="#B69A60" stop-opacity="0.3"/>
      <stop offset="70%" stop-color="#FFFCF9" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="800" height="600" fill="url(#bgDepil)"/>
  <circle cx="400" cy="250" r="180" fill="url(#laserGlow)"/>

  <!-- Símbolo de Luz Laser & Pele Suave -->
  <g transform="translate(400, 240)">
    <!-- Curva suave de pele -->
    <path d="M -160 80 C -80 60 80 100 160 80" fill="none" stroke="#EAD7D3" stroke-width="8" stroke-linecap="round"/>
    
    <!-- Disparo Óptico de Precisão -->
    <path d="M 0 -100 L 0 65" stroke="#B69A60" stroke-width="2" stroke-linecap="round"/>
    <polygon points="0,75 -8,55 8,55" fill="#B69A60"/>
    <circle cx="0" cy="75" r="16" stroke="#B69A60" stroke-width="1.5" stroke-opacity="0.6" fill="none"/>
    <circle cx="0" cy="75" r="28" stroke="#B69A60" stroke-width="0.8" stroke-dasharray="4 4" stroke-opacity="0.4" fill="none"/>

    <!-- Elementos de Cristal de Resfriamento (Snowflake / Cool Crystal) -->
    <line x1="-30" y1="-20" x2="30" y2="-20" stroke="#C6AAB9" stroke-width="1.2" stroke-opacity="0.6"/>
    <line x1="-15" y1="-35" x2="15" y2="-5" stroke="#C6AAB9" stroke-width="1.2" stroke-opacity="0.6"/>
    <line x1="-15" y1="-5" x2="15" y2="-35" stroke="#C6AAB9" stroke-width="1.2" stroke-opacity="0.6"/>
  </g>

  <line x1="280" y1="430" x2="520" y2="430" stroke="#B69A60" stroke-width="1" stroke-opacity="0.4"/>
  <text x="400" y="470" font-family="'Cormorant Garamond', Georgia, serif" font-size="28" font-style="italic" fill="#292625" text-anchor="middle">Depilação a Laser</text>
  <text x="400" y="500" font-family="'Inter', -apple-system, sans-serif" font-size="12" font-weight="500" fill="#B69A60" text-anchor="middle" letter-spacing="4">TECNOLOGIA &amp; RESFRIAMENTO CUTÂNEO</text>
</svg>
