      <stop offset="0%" stop-color="#FAF7F3"/>
      <stop offset="40%" stop-color="#FFFCF9"/>
      <stop offset="100%" stop-color="#EAD7D3" stop-opacity="0.3"/>
    </linearGradient>
  </defs>
  <rect width="800" height="600" fill="url(#bgGradDetox)"/>
  
  <!-- Formas fluidas de água/drenagem/desintoxicação -->
